<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Call 📞</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📞 Book a Call With Jaideep</h1>

        <p class="subtitle">
            Apparently getting a call with me now requires an appointment 😂
        </p>

        <h2>Choose a Day</h2>

        <div class="options" id="day-options">
            <button>Monday</button>
            <button>Tuesday</button>
            <button>Wednesday</button>
            <button>Thursday</button>
            <button>Friday</button>
            <button>Saturday</button>
            <button>Sunday</button>
        </div>

        <h2>Choose a Time</h2>

        <div class="options" id="time-options">
            <button>6:00 PM</button>
            <button>7:00 PM</button>
            <button>8:00 PM</button>
            <button>9:00 PM</button>
            <button>10:00 PM</button>
            <button>11:00 PM</button>
        </div>

        <h2>Reason for the appointment 😌</h2>

        <select>
            <option>Just wanted to hear your voice</option>
            <option>Missing you obviously 😂</option>
            <option>Important gossip</option>
            <option>Other suspicious reasons 👀</option>
        </select>

        <button class="book-button" id="book-button">
            Book My Call ❤️
        </button>

        <div id="confirmation"></div>

        <p class="note">
            Late arrivals may result in additional flirting charges 😂
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
